<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="235" viewBox="0 0 1140 235" role="img" aria-label="MANUAL_BY_TOPIC 예제에서 Writer는 생존을 알립니다. 설정한 lease 안에 새 확인이 도착하지 않으면 Reader가 Liveliness 상태 변화를 보고할 수 있습니다." data-dds-diagram="true">
  <title id="liveliness-lease-ko-title">수동 Liveliness와 lease</title>
  <desc>MANUAL_BY_TOPIC 예제에서 Writer는 생존을 알립니다. 설정한 lease 안에 새 확인이 도착하지 않으면 Reader가 Liveliness 상태 변화를 보고할 수 있습니다.</desc>
  <defs>
    <marker id="liveliness-lease-ko-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="liveliness-lease-ko-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="liveliness-lease-ko-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="235" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 126 116 H 1102" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#liveliness-lease-ko-arrow)"/>
    <path d="M 296 73 H 792" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#liveliness-lease-ko-blue)"/>
    <path d="M 296 82 V 112" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4"/>
    <path d="M 792 82 V 112" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4"/>
    <circle cx="296" cy="116" r="4" fill="#20354B"/>
    <circle cx="792" cy="116" r="4" fill="#356B96"/>
    <text x="296" y="146" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">assert_liveliness()</text>
    <text x="544" y="60" text-anchor="middle" font-size="16" font-weight="bold">예제의 3초 lease</text>
    <text x="797" y="146" text-anchor="middle" font-size="16">추가 확인이 없으면 lease 만료</text>
    <text x="570" y="198" text-anchor="middle" font-size="15">Reader는 Listener 또는 liveliness_changed_status()에서 Liveliness 변화를 확인합니다.</text>
  </g>
</svg>
