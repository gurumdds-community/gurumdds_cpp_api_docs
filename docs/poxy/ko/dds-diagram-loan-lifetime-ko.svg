<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="254" viewBox="0 0 1140 254" role="img" aria-label="read는 레코드를 읽음으로 표시한 채 history에 남기고, take는 history에서 제거합니다. 마지막 소유자가 loan을 반환하며 애플리케이션이 보관한 복사본은 사용할 수 있습니다." data-dds-diagram="true">
  <title id="loan-lifetime-ko-title">Reader history와 샘플 loan 수명</title>
  <desc>read는 레코드를 읽음으로 표시한 채 history에 남기고, take는 history에서 제거합니다. 마지막 소유자가 loan을 반환하며 애플리케이션이 보관한 복사본은 사용할 수 있습니다.</desc>
  <defs>
    <marker id="loan-lifetime-ko-open" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="loan-lifetime-ko-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="loan-lifetime-ko-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="254" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 158 77 H 196" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#loan-lifetime-ko-open)"/>
    <path d="M 158 179 H 196" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#loan-lifetime-ko-open)"/>
    <path d="M 437 77 H 467 V 125 H 496" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#loan-lifetime-ko-open)"/>
    <path d="M 437 179 H 467 V 125" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 774 125 H 831" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#loan-lifetime-ko-arrow)"/>
    <rect x="24" y="51" width="134" height="52" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="24" y="153" width="134" height="52" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="196" y="36" width="241" height="82" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="196" y="138" width="241" height="82" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="496" y="62" width="278" height="126" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <rect x="831" y="62" width="284" height="126" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="91" y="83" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">read()</text>
    <text x="91" y="185" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">take()</text>
    <text x="316" y="69" text-anchor="middle" font-size="16" font-weight="bold">레코드가 history에 남음</text>
    <text x="316" y="95" text-anchor="middle" font-size="15">읽음 상태로 표시</text>
    <text x="316" y="184" text-anchor="middle" font-size="16" font-weight="bold">레코드가 history에서 제거됨</text>
    <text x="635" y="95" text-anchor="middle" font-size="18" font-family="Consolas, Menlo, monospace">LoanedSamples</text>
    <text x="635" y="125" text-anchor="middle" font-size="15">valid() 확인 후 payload 접근</text>
    <text x="635" y="155" text-anchor="middle" font-size="15">나중에 쓸 필드는 이때 복사</text>
    <text x="973" y="95" text-anchor="middle" font-size="16" font-weight="bold">마지막 소유자가 loan 반환</text>
    <text x="973" y="125" text-anchor="middle" font-size="15">loan으로 받은 참조 만료</text>
    <text x="973" y="155" text-anchor="middle" font-size="15">보관한 복사본은 계속 사용 가능</text>
  </g>
</svg>
