<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="291" viewBox="0 0 1140 291" role="img" aria-label="When a reliable Writer needs transmission space, write can wait up to max_blocking_time. It queues the sample if space becomes available. Otherwise the timeout is reported." data-dds-diagram="true">
  <title id="reliable-write-wait-en-title">Waiting for space in a reliable write</title>
  <desc>When a reliable Writer needs transmission space, write can wait up to max_blocking_time. It queues the sample if space becomes available. Otherwise the timeout is reported.</desc>
  <defs>
    <marker id="reliable-write-wait-en-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="reliable-write-wait-en-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="reliable-write-wait-en-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="291" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 267 132 H 346" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#reliable-write-wait-en-arrow)"/>
    <path d="M 694 132 H 742 V 72 H 799" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#reliable-write-wait-en-blue)"/>
    <path d="M 694 132 H 742 V 199 H 799" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#reliable-write-wait-en-arrow)"/>
    <rect x="25" y="93" width="242" height="78" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="146" y="126" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace" font-weight="bold">write(sample)</text>
    <text x="146" y="148" text-anchor="middle" font-size="15">Reliable DataWriter</text>
    <rect x="346" y="93" width="348" height="78" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="520" y="126" text-anchor="middle" font-size="16" font-weight="bold">Send buffer needs space</text>
    <text x="520" y="148" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">max_blocking_time()</text>
    <rect x="799" y="34" width="316" height="76" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="957" y="66" text-anchor="middle" font-size="16" font-weight="bold">Space becomes available</text>
    <text x="957" y="88" text-anchor="middle" font-size="15">Queue the sample</text>
    <rect x="799" y="162" width="316" height="76" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="957" y="194" text-anchor="middle" font-size="16" font-weight="bold">Time budget expires</text>
    <text x="957" y="216" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">dds::core::TimeoutError</text>
    <text x="570" y="268" text-anchor="middle" font-size="15">This limit applies to write(). Acknowledgment waits use their own timeout.</text>
  </g>
</svg>
