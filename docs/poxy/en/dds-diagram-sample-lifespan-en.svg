<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="224" viewBox="0 0 1140 224" role="img" aria-label="Lifespan gives a sample a finite lifetime. When the sample expires, the Reader no longer has that sample available for access." data-dds-diagram="true">
  <title id="sample-lifespan-en-title">A sample's lifespan</title>
  <desc>Lifespan gives a sample a finite lifetime. When the sample expires, the Reader no longer has that sample available for access.</desc>
  <defs>
    <marker id="sample-lifespan-en-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="sample-lifespan-en-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="sample-lifespan-en-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="224" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 126 108 H 1098" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#sample-lifespan-en-arrow)"/>
    <path d="M 281 67 H 771" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#sample-lifespan-en-blue)"/>
    <path d="M 281 71 V 104" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4"/>
    <path d="M 771 71 V 104" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4"/>
    <circle cx="281" cy="108" r="4" fill="#20354B"/>
    <circle cx="771" cy="108" r="4" fill="#356B96"/>
    <text x="281" y="136" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">write(sample)</text>
    <text x="533" y="55" text-anchor="middle" font-size="16" font-weight="bold">Lifespan</text>
    <text x="771" y="136" text-anchor="middle" font-size="16" font-weight="bold">Sample expires</text>
    <text x="1016" y="136" text-anchor="middle" font-size="15">After expiry</text>
    <text x="570" y="187" text-anchor="middle" font-size="15">The lifespan example sets Lifespan on the Writer and inspects received sample timestamps.</text>
  </g>
</svg>
