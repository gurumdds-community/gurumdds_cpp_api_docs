<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="376" viewBox="0 0 1140 376" role="img" aria-label="Check offered Writer and requested Reader settings. A reliable Writer can match a best-effort Reader, but the reverse pair is incompatible. Compare durability and deadline using the same direction." data-dds-diagram="true">
