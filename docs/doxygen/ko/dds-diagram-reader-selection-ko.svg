<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="294" viewBox="0 0 1280 294" role="img" aria-label="DataReader는 Selector를 만들 수 있습니다. Selector의 read와 take는 LoanedSamples를 반환합니다. 각 레코드는 데이터와 메타데이터를 제공합니다." data-dds-diagram="true">
  <title id="reader-selection-ko-title">DataReader 선택자와 반환 샘플</title>
  <desc>DataReader는 Selector를 만들 수 있습니다. Selector의 read와 take는 LoanedSamples를 반환합니다. 각 레코드는 데이터와 메타데이터를 제공합니다.</desc>
  <defs>
    <marker id="reader-selection-ko-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="reader-selection-ko-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
  </defs>
  <rect width="1280" height="294" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 300 139 H 343" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4" marker-end="url(#reader-selection-ko-arrow)"/>
    <path d="M 628 139 H 670" fill="none" stroke="#356B96" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#reader-selection-ko-blue)"/>
    <path d="M 945 139 H 987" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4" marker-end="url(#reader-selection-ko-arrow)"/>
    <rect x="20" y="78" width="280" height="120" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="160" y="100" text-anchor="middle" font-size="18" font-weight="bold">DataReader&lt;T&gt;</text>
    <path d="M 20 111 h 280" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 20 121 h 280" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="30" y="142" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ select() : Selector</text>
    <text x="30" y="163" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ read() : LoanedSamples&lt;T&gt;</text>
    <text x="30" y="184" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ take() : LoanedSamples&lt;T&gt;</text>
    <rect x="343" y="57" width="285" height="162" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="344" y="58" width="283" height="31" fill="#EFF5FA"/>
    <text x="485.5" y="79" text-anchor="middle" font-size="18" font-weight="bold">DataReader&lt;T&gt;::Selector</text>
    <path d="M 343 90 h 285" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 343 100 h 285" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="353" y="121" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ instance(h) : Selector&amp;</text>
    <text x="353" y="142" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ state(s) : Selector&amp;</text>
    <text x="353" y="163" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ max_samples(n) : Selector&amp;</text>
    <text x="353" y="184" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ read() : LoanedSamples&lt;T&gt;</text>
    <text x="353" y="205" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ take() : LoanedSamples&lt;T&gt;</text>
    <rect x="670" y="78" width="275" height="120" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="807.5" y="100" text-anchor="middle" font-size="18" font-weight="bold">LoanedSamples&lt;T&gt;</text>
    <path d="M 670 111 h 275" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 670 121 h 275" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="680" y="142" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ begin() : const_iterator</text>
    <text x="680" y="163" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ end() : const_iterator</text>
    <text x="680" y="184" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ length() : uint32_t</text>
    <rect x="987" y="89" width="273" height="99" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="1123.5" y="111" text-anchor="middle" font-size="18" font-weight="bold">Sample&lt;T, TInfo&gt;</text>
    <path d="M 987 122 h 273" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 987 132 h 273" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="997" y="153" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ data() : const T&amp;</text>
    <text x="997" y="174" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ info() : const TInfo&amp;</text>
    <text x="321" y="124" text-anchor="middle" font-size="12">생성</text>
    <text x="650" y="124" text-anchor="middle" font-size="12">반환</text>
    <text x="967" y="124" text-anchor="middle" font-size="12">순회</text>
    <text x="20" y="263" text-anchor="start" font-size="15">data()에 접근하기 전에 info().valid()를 확인합니다. 템플릿 인자와 오버로드 표기를 줄였습니다.</text>
  </g>
</svg>
