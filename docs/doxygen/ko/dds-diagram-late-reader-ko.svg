<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="310" viewBox="0 0 1140 310" role="img" aria-label="살아 있는 Writer는 TRANSIENT_LOCAL durability로 샘플을 보관합니다. 쓰기 이후 TRANSIENT_LOCAL과 RELIABLE을 사용하는 Reader가 생성되고, 매칭된 뒤 보관된 샘플을 받습니다." data-dds-diagram="true">
  <title id="late-reader-ko-title">늦게 참가한 Reader가 보관된 샘플을 수신</title>
  <desc>살아 있는 Writer는 TRANSIENT_LOCAL durability로 샘플을 보관합니다. 쓰기 이후 TRANSIENT_LOCAL과 RELIABLE을 사용하는 Reader가 생성되고, 매칭된 뒤 보관된 샘플을 받습니다.</desc>
  <defs>
    <marker id="late-reader-ko-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="late-reader-ko-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
  </defs>
  <rect width="1140" height="310" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 184 100 H 1111" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#late-reader-ko-arrow)"/>
    <path d="M 520 203 H 1111" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#late-reader-ko-arrow)"/>
    <path d="M 693 100 V 203" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4"/>
    <path d="M 903 100 V 203" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#late-reader-ko-blue)"/>
    <path d="M 184 261 H 1111" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#late-reader-ko-arrow)"/>
    <circle cx="293" cy="100" r="4" fill="#20354B"/>
    <circle cx="693" cy="100" r="4" fill="#20354B"/>
    <circle cx="903" cy="100" r="4" fill="#356B96"/>
    <circle cx="520" cy="203" r="4" fill="#20354B"/>
    <circle cx="693" cy="203" r="4" fill="#20354B"/>
    <circle cx="903" cy="203" r="4" fill="#356B96"/>
    <text x="24" y="105" text-anchor="start" font-size="16" font-weight="bold">DataWriter</text>
    <text x="24" y="208" text-anchor="start" font-size="16" font-weight="bold">DataReader</text>
    <text x="294" y="75" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">write(sample)</text>
    <text x="851" y="75" text-anchor="middle" font-size="16">Writer가 살아 있는 동안 샘플 보관</text>
    <text x="520" y="229" text-anchor="middle" font-size="16">Reader 생성</text>
    <text x="693" y="156" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Endpoint 매칭</text>
    <text x="921" y="150" text-anchor="start" font-size="15" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">보관된 샘플 전달</text>
    <text x="924" y="228" text-anchor="start" font-size="15" font-family="Consolas, Menlo, monospace">reader.take()</text>
    <text x="24" y="266" text-anchor="start" font-size="15" fill="#677B8D">시간</text>
    <text x="569" y="290" text-anchor="middle" font-size="15">이 예제의 양쪽 Endpoint는 TRANSIENT_LOCAL과 RELIABLE을 사용합니다.</text>
  </g>
</svg>
