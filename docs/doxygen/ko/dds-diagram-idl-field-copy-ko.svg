    <path d="M 670 233 H 826" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#idl-field-copy-ko-blue)"/>
    <rect x="32" y="211" width="253" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="456" y="211" width="214" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="826" y="211" width="283" height="46" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
