    <text x="748" y="88" text-anchor="middle" font-size="14">값 복사</text>
    <path d="M 285 164 H 456" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#idl-field-copy-ko-arrow)"/>
    <path d="M 670 164 H 826" fill="none" stroke="#356B96" stroke-width="1.7" marker-end="url(#idl-field-copy-ko-blue)"/>
    <rect x="32" y="142" width="253" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="456" y="142" width="214" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="826" y="142" width="283" height="46" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="158" y="171" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace">bounds[2]</text>
