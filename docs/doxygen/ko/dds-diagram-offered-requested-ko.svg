<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="376" viewBox="0 0 1140 376" role="img" aria-label="Writer가 제공하는 QoS와 Reader가 요청하는 QoS를 확인합니다. Reliable Writer는 Best-effort Reader와 매칭할 수 있으며 반대 조합은 비호환입니다. Durability와 Deadline도 같은 방향으로 비교합니다." data-dds-diagram="true">
  <title id="offered-requested-ko-title">제공 QoS와 요청 QoS의 호환 조건</title>
  <desc>Writer가 제공하는 QoS와 Reader가 요청하는 QoS를 확인합니다. Reliable Writer는 Best-effort Reader와 매칭할 수 있으며 반대 조합은 비호환입니다. Durability와 Deadline도 같은 방향으로 비교합니다.</desc>
