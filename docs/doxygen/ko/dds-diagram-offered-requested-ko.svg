    <rect x="835" y="196" width="280" height="40" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="975" y="221" text-anchor="middle" font-size="15">비호환</text>
    <rect x="835" y="236" width="280" height="40" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="975" y="261" text-anchor="middle" font-size="15">호환</text>
    <rect x="835" y="276" width="280" height="40" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="975" y="301" text-anchor="middle" font-size="15">비호환</text>
    <text x="570" y="352" text-anchor="middle" font-size="15">각 행은 정책 하나를 비교합니다. 나머지 매칭 조건도 충족해야 합니다.</text>
