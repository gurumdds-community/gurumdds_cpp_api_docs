<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="202" viewBox="0 0 1140 202" role="img" aria-label="A write makes the instance alive. dispose marks it disposed. Another write makes it alive again. The only writer unregisters, with automatic disposal off." data-dds-diagram="true">
  <title id="keyed-instance-en-title">Instance state changes for a single key</title>
  <desc>A write makes the instance alive. dispose marks it disposed. Another write makes it alive again. The only writer unregisters, with automatic disposal off.</desc>
  <defs>
    <marker id="keyed-instance-en-open" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="keyed-instance-en-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="keyed-instance-en-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="202" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <circle cx="37" cy="103" r="6" fill="#20354B"/>
    <path d="M 44 103 H 118" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#keyed-instance-en-open)"/>
    <path d="M 250 103 H 342" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#keyed-instance-en-open)"/>
    <path d="M 560 103 H 659" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#keyed-instance-en-open)"/>
    <path d="M 794 103 H 881" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#keyed-instance-en-open)"/>
    <rect x="118" y="79" width="132" height="48" rx="7" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <rect x="342" y="79" width="218" height="48" rx="7" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="659" y="79" width="135" height="48" rx="7" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <rect x="881" y="79" width="235" height="48" rx="7" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="184" y="109" text-anchor="middle" font-size="17" font-family="Consolas, Menlo, monospace">ALIVE</text>
    <text x="451" y="109" text-anchor="middle" font-size="17" font-family="Consolas, Menlo, monospace">NOT_ALIVE_DISPOSED</text>
    <text x="726" y="109" text-anchor="middle" font-size="17" font-family="Consolas, Menlo, monospace">ALIVE</text>
    <text x="998" y="109" text-anchor="middle" font-size="17" font-family="Consolas, Menlo, monospace">NOT_ALIVE_NO_WRITERS</text>
    <text x="82" y="63" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace">write(&quot;hello&quot;)</text>
    <text x="296" y="63" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace">dispose_instance()</text>
    <text x="609" y="63" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace">write(&quot;world&quot;)</text>
    <text x="837" y="63" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace">unregister_instance()</text>
    <text x="570" y="168" text-anchor="middle" font-size="15">One Writer for the key, with automatic disposal on unregister disabled</text>
  </g>
</svg>
