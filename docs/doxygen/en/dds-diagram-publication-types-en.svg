<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="292" viewBox="0 0 1140 292" role="img" aria-label="A Publisher supplies defaults to its DataWriters. Each DataWriter uses a typed Topic, has its own QoS and can register a listener." data-dds-diagram="true">
  <title id="publication-types-en-title">Publisher and DataWriter class relationships</title>
  <desc>A Publisher supplies defaults to its DataWriters. Each DataWriter uses a typed Topic, has its own QoS and can register a listener.</desc>
  <defs>
    <marker id="publication-types-en-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="publication-types-en-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="publication-types-en-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="292" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <path d="M 334 138 H 416" fill="none" stroke="#20354B" stroke-width="1.15" marker-end="url(#publication-types-en-arrow)"/>
    <path d="M 746 112 H 824 V 69 H 875" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4" marker-end="url(#publication-types-en-arrow)"/>
    <path d="M 746 158 H 824 V 202 H 875" fill="none" stroke="#20354B" stroke-width="1.15" stroke-dasharray="5 4" marker-end="url(#publication-types-en-arrow)"/>
    <rect x="24" y="63" width="310" height="121" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 24 97 h 310" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 24 108 h 310" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="179" y="86" text-anchor="middle" font-size="19" font-family="Georgia, Malgun Gothic, serif" font-weight="bold">Publisher</text>
    <text x="35" y="129" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ participant()</text>
    <text x="35" y="150" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace" textLength="288" lengthAdjust="spacingAndGlyphs">+ default_writer_qos() : DataWriterQos</text>
    <text x="35" y="171" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace" textLength="274" lengthAdjust="spacingAndGlyphs">+ wait_for_acknowledgments(timeout)</text>
    <rect x="416" y="47" width="330" height="142" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <rect x="417" y="48" width="328" height="32" fill="#EFF5FA"/>
    <path d="M 416 81 h 330" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 416 92 h 330" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="581" y="70" text-anchor="middle" font-size="19" font-family="Georgia, Malgun Gothic, serif" font-weight="bold">DataWriter&lt;T&gt;</text>
    <text x="427" y="113" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ write(const T&amp;)</text>
    <text x="427" y="134" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ qos() : DataWriterQos</text>
    <text x="427" y="155" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ listener(Listener*, StatusMask)</text>
    <text x="427" y="176" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace">+ publisher()</text>
    <rect x="875" y="20" width="240" height="79" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 875 54 h 240" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 875 65 h 240" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="995" y="43" text-anchor="middle" font-size="19" font-family="Georgia, Malgun Gothic, serif" font-weight="bold">Topic&lt;T&gt;</text>
    <text x="886" y="86" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace" textLength="218" lengthAdjust="spacingAndGlyphs">+ name() : const std::string&amp;</text>
    <rect x="875" y="149" width="240" height="79" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 875 183 h 240" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <path d="M 875 194 h 240" fill="none" stroke="#20354B" stroke-width="1.15"/>
    <text x="995" y="172" text-anchor="middle" font-size="19" font-family="Georgia, Malgun Gothic, serif" textLength="218" lengthAdjust="spacingAndGlyphs" font-weight="bold">DataWriterListener&lt;T&gt;</text>
    <text x="886" y="215" text-anchor="start" font-size="14" font-family="Consolas, Menlo, monospace" textLength="218" lengthAdjust="spacingAndGlyphs">+ on_publication_matched(...)</text>
    <text x="375" y="127" text-anchor="middle" font-size="13">0..*</text>
    <text x="570" y="262" text-anchor="middle" font-size="15">The Publisher owns the writer group. Each Writer applies its own DataWriterQos.</text>
  </g>
</svg>
