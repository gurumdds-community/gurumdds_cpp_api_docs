<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="228" viewBox="0 0 1140 228" role="img" aria-label="The Reader uses separate configured delays to purge samples for disposed instances and instances without writers." data-dds-diagram="true">
  <title id="reader-purge-delay-en-title">Instance state and Reader purge delays</title>
  <desc>The Reader uses separate configured delays to purge samples for disposed instances and instances without writers.</desc>
  <defs>
    <marker id="reader-purge-delay-en-arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,6 L 1,11" fill="none" stroke="#20354B" stroke-width="1.2"/></marker>
    <marker id="reader-purge-delay-en-blue" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 11,5 L 0,10 Z" fill="#356B96"/></marker>
    <marker id="reader-purge-delay-en-uml" viewBox="0 0 15 15" refX="14" refY="7.5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 14,7.5 L 1,14 Z" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/></marker>
  </defs>
  <rect width="1140" height="228" fill="#FFFFFF"/>
  <g fill="#20354B" font-family="Arial, Malgun Gothic, sans-serif">
    <rect x="25" y="30" width="300" height="46" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="175" y="58" text-anchor="middle" font-size="16" font-weight="bold">Instance state</text>
    <rect x="25" y="76" width="300" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="175" y="104" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">NOT_ALIVE_DISPOSED</text>
    <rect x="25" y="122" width="300" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="175" y="150" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">NOT_ALIVE_NO_WRITERS</text>
    <rect x="325" y="30" width="465" height="46" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="557.5" y="58" text-anchor="middle" font-size="16" font-weight="bold">Delay used by the Reader</text>
    <rect x="325" y="76" width="465" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="557.5" y="104" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">autopurge_disposed_samples_delay()</text>
    <rect x="325" y="122" width="465" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="557.5" y="150" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace">autopurge_nowriter_samples_delay()</text>
    <rect x="790" y="30" width="325" height="46" fill="#EFF5FA" stroke="#20354B" stroke-width="1.15"/>
    <text x="952.5" y="58" text-anchor="middle" font-size="16" font-weight="bold">When the delay expires</text>
    <rect x="790" y="76" width="325" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="952.5" y="104" text-anchor="middle" font-size="15" textLength="256" lengthAdjust="spacingAndGlyphs">Eligible samples can be purged</text>
    <rect x="790" y="122" width="325" height="46" fill="#FFFFFF" stroke="#20354B" stroke-width="1.15"/>
    <text x="952.5" y="150" text-anchor="middle" font-size="15" textLength="256" lengthAdjust="spacingAndGlyphs">Eligible samples can be purged</text>
    <text x="570" y="204" text-anchor="middle" font-size="15">Set the delays before creating the Reader. The sample remains subject to history and resource limits.</text>
  </g>
</svg>
